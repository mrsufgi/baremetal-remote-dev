# =============================================================================
# tmux.conf — Remote Dev Server
# =============================================================================
# Installed to ~/.tmux.conf by bootstrap.sh
# =============================================================================

# --- General ---
set-option -g history-limit 200000
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# --- Terminal / Colors ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Prefix: keep C-b, add C-a as secondary ---
set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix -2

# --- Splits: intuitive keys ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation (vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- New windows in current path ---
bind c new-window -c "#{pane_current_path}"

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- Copy mode (vi-style) ---
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Status bar ---
set -g status-interval 5
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left-length 30
set -g status-right-length 60
set -g status-left '#[fg=#89b4fa,bold][#S] '
set -g status-right '#[fg=#a6adc8]#H #[fg=#585b70]| #[fg=#a6adc8]%Y-%m-%d %H:%M'

# Window status
setw -g window-status-format '#[fg=#6c7086] #I:#W '
setw -g window-status-current-format '#[fg=#89b4fa,bold] #I:#W '

# Pane borders
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'

# Message style
set -g message-style 'bg=#1e1e2e fg=#cdd6f4'
